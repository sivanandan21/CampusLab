[project]
name = "campuslab-worker"
version = "1.0.0"
description = "CampusLab Private EC2 Lab Worker Service (Docker Runtime & PTY Streamer)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "docker>=7.1.0",
    "websockets>=12.0",
    "psutil>=5.9.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
