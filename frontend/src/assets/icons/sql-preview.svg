<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 90" fill="none">
  <rect width="200" height="90" rx="10" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="12" cy="12" r="3" fill="#CBD5E1"/>
  <circle cx="20" cy="12" r="3" fill="#CBD5E1"/>
  <circle cx="28" cy="12" r="3" fill="#CBD5E1"/>
  <text x="12" y="32" fill="#2563EB" font-family="monospace" font-size="8" font-weight="bold">SELECT e.emp_id, d.dept_name</text>
  <text x="12" y="44" fill="#64748B" font-family="monospace" font-size="8">FROM employees e JOIN depts d</text>
  <text x="12" y="56" fill="#64748B" font-family="monospace" font-size="8">ON e.dept_id = d.dept_id</text>
  <text x="12" y="68" fill="#10B981" font-family="monospace" font-size="8">WHERE s.salary &gt; AVG(salary);</text>
  <text x="12" y="80" fill="#0284C7" font-family="monospace" font-size="8">Execution: 0.12ms (Index Scan)</text>
</svg>
