<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 180" fill="none">
  <!-- Glowing background elements -->
  <circle cx="280" cy="80" r="70" fill="#3B82F6" fill-opacity="0.2" filter="blur(25px)"/>
  <circle cx="80" cy="110" r="50" fill="#EC4899" fill-opacity="0.15" filter="blur(20px)"/>

  <!-- Orange Folder Icon -->
  <g transform="translate(15, 35)">
    <path d="M10 22C10 17 14 13 19 13H42L52 23H85C90 23 94 17 94 32V68C94 73 90 77 85 77H19C14 77 10 73 10 68V22Z" fill="#F59E0B" fill-opacity="0.9"/>
    <path d="M5 34C5 29 9 25 14 25H90C95 25 99 29 99 34V76C99 81 95 85 90 85H14C9 85 5 81 5 76V34Z" fill="#FBBF24"/>
  </g>

  <!-- Floating Main Neon Terminal Window -->
  <g transform="translate(85, 20)">
    <!-- Terminal Body -->
    <rect width="210" height="135" rx="16" fill="#0B132B" stroke="#38BDF8" stroke-width="2.5" stroke-opacity="0.8"/>
    <!-- Top control buttons -->
    <circle cx="18" cy="18" r="4.5" fill="#EF4444"/>
    <circle cx="32" cy="18" r="4.5" fill="#F59E0B"/>
    <circle cx="46" cy="18" r="4.5" fill="#10B981"/>
    <rect x="150" y="14" width="45" height="9" rx="4.5" fill="#1E293B"/>

    <!-- Terminal Code / OS Text -->
    <text x="18" y="52" fill="#34D399" font-family="monospace" font-size="14" font-weight="bold">&gt; _</text>
    <text x="48" y="72" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="1">OS</text>

    <!-- Neon Code Brackets & Lines -->
    <text x="110" y="70" fill="#EC4899" font-family="monospace" font-size="28" font-weight="bold">&#123; &#125;</text>
    <rect x="18" y="94" width="95" height="5" rx="2.5" fill="#60A5FA" fill-opacity="0.8"/>
    <rect x="18" y="105" width="130" height="5" rx="2.5" fill="#93C5FD" fill-opacity="0.6"/>
    <rect x="18" y="116" width="70" height="5" rx="2.5" fill="#34D399" fill-opacity="0.7"/>

    <!-- Floating Mini Terminal Window on bottom-right -->
    <g transform="translate(130, 75)">
      <rect width="90" height="60" rx="10" fill="#0F172A" stroke="#818CF8" stroke-width="2"/>
      <circle cx="12" cy="12" r="3" fill="#EF4444"/>
      <circle cx="20" cy="12" r="3" fill="#10B981"/>
      <line x1="12" y1="28" x2="65" y2="28" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="38" x2="45" y2="38" stroke="#F43F5E" stroke-width="3" stroke-linecap="round"/>
      <line x1="12" y1="48" x2="72" y2="48" stroke="#34D399" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
</svg>
