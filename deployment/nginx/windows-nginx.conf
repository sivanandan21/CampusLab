# ==============================================================================
# CampusLab Native Windows Nginx Configuration
# Run directly with Windows Nginx binary:
# nginx.exe -c d:\project\CampusLab\deployment\nginx\windows-nginx.conf
# ==============================================================================

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    # Local upstreams
    upstream local_frontend {
        server 127.0.0.1:5173;
    }

    upstream local_backend {
        server 127.0.0.1:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Interactive Terminal WebSocket Gateway
        location /api/v1/terminal/ws {
            proxy_pass http://local_backend/api/v1/terminal/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # 2. REST API Gateway
        location /api/v1/ {
            proxy_pass http://local_backend/api/v1/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Frontend App (Vite Dev Server or Built SPA)
        location / {
            proxy_pass http://local_frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /health {
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
